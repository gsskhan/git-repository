logging.level.root=INFO
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.demo.kafka.app=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n

server.port=8080
spring.main.banner-mode=off
spring.application.name=kafka-demo

# Application-specific settings
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topic.demo=my-test-topic
app.kafka.consumer.group-id=my-demo-app-group