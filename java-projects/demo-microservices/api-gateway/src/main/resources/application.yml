server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: orders
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**
        - id: products
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**
  application:
    name: API-GATEWAY

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG